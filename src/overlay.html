
<!doctype html><html lang="pt"><head><meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;color:#e8dfce;font-family:Consolas,monospace;overflow:hidden}
.box{margin:14px;padding:16px 18px;border:1px solid #9b7130;background:rgba(5,8,9,.72);box-shadow:0 0 28px rgba(0,0,0,.6);border-radius:4px}
.t{color:#d59b3a;font-weight:800;letter-spacing:2px;font-size:12px}.p{font-size:22px;margin-top:8px}.b{color:#d59b3a}.s{font-size:11px;color:#9ba099;margin-top:7px}
</style></head><body><div class="box"><div class="t">TARKOV HUD PT · LIVE</div>
<div class="p">X <span id=x>---</span> · Y <span id=y>---</span> · Z <span id=z>---</span></div>
<div>RUMO <span class=b id=b>---</span>°</div><div class=s id=s>À espera de screenshot…</div>
</div><script>
window.tarkov.onPosition(p=>{x.textContent=p.x.toFixed(1);y.textContent=p.y.toFixed(1);z.textContent=p.z.toFixed(1);b.textContent=(((p.bearing%360)+360)%360).toFixed(0);s.textContent='Atualizado '+new Date(p.time||Date.now()).toLocaleTimeString('pt-PT')});
</script></body></html>
