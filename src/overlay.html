<!doctype html><html lang="pt"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://raw.githubusercontent.com data:; connect-src 'self' https://raw.githubusercontent.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font:12px Arial;color:#eee}
#box{position:absolute;inset:12px;border:1px solid #e0a34366;background:#071014b5;box-shadow:0 0 30px #0008;overflow:hidden;border-radius:6px}
#map{position:absolute;inset:0;background:#101415;overflow:hidden}
img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center}
#p{position:absolute;width:20px;height:20px;border:3px solid #f0b34e;border-radius:50%;box-shadow:0 0 18px #f0b34e;transform:translate(-50%,-50%);display:none}
#bar{position:absolute;left:12px;right:12px;top:10px;height:28px;display:flex;align-items:center;justify-content:space-between;background:#06090bdc;border:1px solid #3b3428;padding:0 9px;border-radius:4px;font-family:monospace}
b{color:#e0a343}
</style></head><body><div id="box"><div id="map"><img id="img"><div id="p"></div></div><div id="bar"><span>TARKOV HUD PT · OVERLAY</span><span id="s">A aguardar tracking</span></div></div>
<script>
const RAW='https://raw.githubusercontent.com/sayser/TarkovTracker/master/';let state={};
const bounds={customs:[[698,-307],[-372,237]],factory:[[77,-64.5],[-65.5,67.4]],woods:[[646,-914],[-761,442]],shoreline:[[504,-415],[-1056,618]],interchange:[[598,-442],[-433,426]],lab:[[-80,-477],[-287,-193]],reserve:[[289,-293],[-303,244]],lighthouse:[[515,-998],[-545,725]],streets:[[323,-295],[-280,532]],groundzero:[[249,-124],[-99,364]],terminal:[[-768,440],[-1512,1346]],labyrinth:[[-52,-37],[53,76]]};
const files={customs:'Customs.svg',factory:'Factory.svg',woods:'Woods.svg',shoreline:'Shoreline.svg',interchange:'Interchange.svg',lab:'Labs.svg',reserve:'Reserve.svg',lighthouse:'Lighthouse.svg',streets:'StreetsOfTarkov.svg',groundzero:'GroundZero.svg',terminal:'Terminal.svg',labyrinth:'Labyrinth.svg'};
const img=document.getElementById('img'),p=document.getElementById('p'),map=document.getElementById('map');let zoom=.7;
function load(m){img.src=RAW+'Maps/'+files[m];}
function place(){if(state.x==null)return;let b=bounds[state.map]||bounds.customs,x=(state.x-b[1][0])/(b[0][0]-b[1][0]),z=(state.z-b[0][1])/(b[1][1]-b[0][1]);p.style.left=(x*map.clientWidth)+'px';p.style.top=(z*map.clientHeight)+'px';p.style.display='block';document.getElementById('s').innerHTML=`${state.map} · <b>${state.x.toFixed(1)}, ${state.z.toFixed(1)}</b>`}
window.tarkov.onSyncState(s=>{state=s;load(s.map||'customs');place()});
load('customs');
</script></body></html>
